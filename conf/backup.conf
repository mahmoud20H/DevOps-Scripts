# ==========================================
# Automated Backup Default Configuration
# ==========================================
# These values pre-fill the interactive prompts in bin/backup.sh.
# Operators can override them at runtime when the script runs.

# Space-separated list of files and/or directories to include in the archive
DEFAULT_SOURCES="/etc /var/www"

# Directory where timestamped .tar.gz backups are stored
DEFAULT_DEST_DIR="/backup"
