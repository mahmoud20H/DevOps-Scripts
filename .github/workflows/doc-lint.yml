# =============================================================================
# Documentation Validation
# =============================================================================
# Keeps README formatting consistent and ensures Markdown links stay reachable.
# Runs only when Markdown changes on a pull request.
# =============================================================================

name: Documentation Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  markdown-and-links:
    name: Markdown lint and link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint README with markdownlint-cli2
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: README.md

      # -----------------------------------------------------------------------
      # Crawl all Markdown files for broken HTTP(S) links; fail on any error.
      # -----------------------------------------------------------------------
      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-mail './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
