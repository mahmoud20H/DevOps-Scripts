# =============================================================================
# Automated Semantic Releases (Conventional Commits)
# =============================================================================
# Release Please opens/updates a release PR from conventional commits (feat:, fix:,
# etc.), maintains CHANGELOG.md, bumps VERSION, and publishes GitHub Releases.
# When a release is cut on main, we attach a tarball of bin/, lib/, and conf/.
# =============================================================================

name: Semantic Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Release Please creates tags/releases and opens PRs; needs write access.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Parses conventional commits on main and manages version + CHANGELOG.
      # "simple" release type suits script-only repos (VERSION + CHANGELOG.md).
      # Bootstrap: first run may open a PR to add those files—merge it once.
      # -----------------------------------------------------------------------
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: devops-scripts

  # ---------------------------------------------------------------------------
  # attach a portable bundle when Release Please publishes a new tag.
  # ---------------------------------------------------------------------------
  release-assets:
    name: Upload release tarball
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package bin, lib, and conf directories
        run: |
          set -euo pipefail
          tar -czf release.tar.gz bin lib conf
          ls -lh release.tar.gz

      - name: Upload tarball to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            release.tar.gz \
            --repo "${{ github.repository }}" \
            --clobber
