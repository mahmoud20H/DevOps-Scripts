# =============================================================================
# Automated Semantic Releases (Conventional Commits)
# =============================================================================
# Release Please reads release-please-config.json + .release-please-manifest.json,
# bumps version.txt / CHANGELOG.md, opens a release PR, and publishes GitHub
# Releases when that PR merges.
#
# REQUIRED (one-time, repo admin):
#   Settings → Actions → General → Workflow permissions → enable
#   "Allow GitHub Actions to create and approve pull requests"
#   Without this, GITHUB_TOKEN cannot open the release PR (see workflow error).
#
# Commits on main should use Conventional Commits, e.g.:
#   feat: add backup utility
#   fix: correct disk-monitor threshold parsing
# =============================================================================

name: Semantic Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  release-assets:
    name: Upload release tarball
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package bin, lib, and conf directories
        run: |
          set -euo pipefail
          tar -czf release.tar.gz bin lib conf
          ls -lh release.tar.gz

      - name: Upload tarball to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            release.tar.gz \
            --repo "${{ github.repository }}" \
            --clobber
